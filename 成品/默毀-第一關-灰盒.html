<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>默毀 第一章：尋姐</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:10px;left:12px;color:#8a8578;font-family:"Microsoft JhengHei","PingFang TC",serif;font-size:14px;line-height:1.6;pointer-events:none;text-shadow:0 1px 2px #000;}
  #hint{display:block;font-size:13px;color:#6f6a5e;}
  #actBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:7%;padding:12px 38px;background:rgba(18,18,22,.88);color:#cfc9bd;border:1px solid #4a4a52;border-radius:4px;font-size:18px;font-family:"Microsoft JhengHei","PingFang TC",serif;letter-spacing:4px;cursor:pointer;}
  #actBtn:active{background:rgba(40,40,46,.95);}
  #panel{position:fixed;left:50%;transform:translateX(-50%);bottom:15%;width:min(580px,88%);background:rgba(8,8,10,.94);border:1px solid #2c2c33;padding:16px 20px;box-sizing:border-box;font-family:"Microsoft JhengHei","PingFang TC",serif;cursor:pointer;}
  #panelTitle{font-size:13px;color:#7c7668;letter-spacing:2px;margin-bottom:8px;}
  #panelText{color:#b9b2a2;font-size:15.5px;line-height:1.8;white-space:pre-line;}
  #panelClose{margin-top:10px;font-size:11px;color:#57534a;letter-spacing:1px;}
  .overlay{position:fixed;inset:0;background:rgba(3,3,5,.95);color:#b9b2a2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-family:"Microsoft JhengHei","PingFang TC",serif;padding:24px;box-sizing:border-box;}
  .overlay h1{font-size:30px;letter-spacing:14px;color:#cfc9bd;font-weight:400;margin:0 0 6px;}
  .overlay h2{font-size:15px;letter-spacing:6px;color:#7c7668;font-weight:400;margin:0 0 26px;}
  .overlay p{font-size:15px;line-height:2;margin:4px 0;max-width:520px;}
  .overlay button{margin-top:30px;padding:12px 46px;background:transparent;color:#cfc9bd;border:1px solid #5a5a62;font-size:17px;letter-spacing:8px;cursor:pointer;font-family:inherit;}
  .overlay button:hover{background:rgba(207,201,189,.08);}
  .ctrl{font-size:12px;color:#57534a;margin-top:22px;letter-spacing:1px;}
  #end h1{letter-spacing:10px;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><span id="clueCount">線索 0 / 3</span><span id="hint">找人，先找她留下的東西。</span></div>
<button id="actBtn" hidden>看</button>
<div id="panel" hidden><div id="panelTitle"></div><div id="panelText"></div><div id="panelClose">按 E 或點一下收起</div></div>
<div id="title" class="overlay">
  <h1>默毀</h1>
  <h2>第一章　尋姐</h2>
  <p>姐姐在這所學校失蹤，已經四十九天。</p>
  <p>學校早就廢了。你還是回來了。</p>
  <p>找人，先找她留下的東西。</p>
  <button id="startBtn">開　始</button>
  <p class="ctrl">WASD／方向鍵移動　E 或空白鍵互動　手機：按住拖曳</p>
</div>
<div id="end" class="overlay" hidden>
  <h1>第一章　完</h1>
  <p>走廊的燈全滅了。</p>
  <p>你聽見高處傳來的，不是風。</p>
  <p style="color:#7c7668;font-size:13px;margin-top:18px">（下一章：頂樓。她要你上去。）</p>
  <button onclick="location.reload()">重新開始</button>
</div>
<script>
"use strict";
/* ============ 地圖 ============ */
var T = 48;
var MAP = [
"##################################",
"#........#............#..........#",
"#........#............#..........#",
"#........#............#..........#",
"#........#............#..........#",
"#........#............#..........#",
"####D##########D###########D######",
"#................................#",
"#................................L",
"#................................#",
"####D##########D###########D######",
"#......#.........................#",
"#......#.........................#",
"#......#.........................W",
"#......#.........................W",
"#......#.........................W",
"#......#............P............#",
"#......#.........................#",
"##################################"
];
var MW = MAP[0].length, MH = MAP.length;
function tileAt(c, r){ if(c<0||r<0||c>=MW||r>=MH) return "#"; return MAP[r].charAt(c); }
function solid(ch){ return ch==="#"||ch==="L"||ch==="W"; }

/* ============ 畫布 ============ */
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var viewW = 0, viewH = 0;
function resize(){ viewW = cv.width = window.innerWidth; viewH = cv.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

/* ============ 狀態 ============ */
var state = "title";           // title | play | finale | end
var player = { x: 20.5*T, y: 16.5*T, r: 12, speed: 145 };
var cluesMain = 0, noteTaken = false;
var tension = 0.12;
var flick = 1, flickUntil = 0;
var blackout = 0, blackoutOn = false;
var finaleT = 0, appa = null, ended = false;
var visitedA = false, boomDone = false;
var time = 0, lastTs = 0;

/* ============ 線索 ============ */
var items = [
 { id:"board", x:4.5*T, y:1.5*T, main:true, taken:false,
   title:"教室甲・黑板", 
   text:"「不要再傳了……\n他們約好一起走。\n可是他沒有跳。\n只有她，從頂樓跳了下去。」" },
 { id:"desk", x:26.5*T, y:3.5*T, main:false, taken:false,
   title:"教室乙・課桌裡的字條（姐姐的字跡）",
   text:"「他們都在說那個女生。\n我在查她的名字。\n名字被塗掉了。」" },
 { id:"board2", x:8.5*T, y:12.5*T, main:true, taken:false,
   title:"川堂・公告欄《校史節錄》",
   text:"「……民國四十餘年建校於此地。\n建校之前，此處為戰後亂葬之崗。\n因地貌特殊、窪地聚氣，\n僅以土方填平，未行遷葬……」" },
 { id:"window", x:32.5*T, y:14.5*T, main:true, taken:false,
   title:"川堂東側・大窗",
   text:"窗外操場的東側，有一塊隆起的土丘，\n寸草不生。\n風吹過來，是涼的。" },
 { id:"poster", x:26.5*T, y:7.5*T, main:false, taken:false,
   title:"走廊・泛黃的影印紙",
   text:"「協尋　三年一班　□□□\n於校慶當日失蹤……」\n名字那一欄被水漬暈開了。\n你姐姐的名字，你還唸得出口嗎。" },
 { id:"gate", x:32.5*T, y:8.5*T, main:false, taken:false,
   title:"走廊盡頭・鐵門",
   text:"通往頂樓的鐵門被鎖死了。\n門把上纏著一圈很舊的紅線。" }
];
function nearestItem(){
  var best=null, bd=1e9;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var dx=it.x-player.x, dy=it.y-player.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d<64 && d<bd){ bd=d; best=it; }
  }
  return best;
}

/* ============ 音效（全部 WebAudio 即時合成） ============ */
var AC=null, master=null, windGain=null, windFilter=null;
function initAudio(){
  if(AC){ AC.resume(); return; }
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if(!Ctor) return;
  AC = new Ctor();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  var len = AC.sampleRate*2;
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  window._noise = buf;
  var src = AC.createBufferSource(); src.buffer=buf; src.loop=true;
  windFilter = AC.createBiquadFilter(); windFilter.type="lowpass"; windFilter.frequency.value=220;
  windGain = AC.createGain(); windGain.gain.value=0.022;
  src.connect(windFilter); windFilter.connect(windGain); windGain.connect(master);
  src.start();
  setInterval(function(){
    if(!AC) return;
    windFilter.frequency.value = 170+Math.random()*150;
    windGain.gain.value = 0.014+Math.random()*0.018+tension*0.012;
  }, 1400);
  setInterval(function(){
    if(!AC || state==="end") return;
    if(Math.random() < 0.012+tension*0.075){
      if(Math.random()<0.5) creak(player.x); else whisper(player.x);
    }
  }, 650);
  beatLoop();
}
function panner(x){
  if(!AC.createStereoPanner) return null;
  var p=AC.createStereoPanner();
  p.pan.value = Math.max(-1, Math.min(1, (x-player.x)/420));
  return p;
}
function out(node, x){
  var pan = panner(x);
  if(pan){ node.connect(pan); pan.connect(master); } else node.connect(master);
}
function thump(){
  if(!AC) return;
  var t=AC.currentTime;
  for(var i=0;i<2;i++){
    var o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.setValueAtTime(i?42:55, t+i*0.26);
    o.frequency.exponentialRampToValueAtTime(30, t+i*0.26+0.14);
    g.gain.setValueAtTime(0.0001, t+i*0.26);
    g.gain.exponentialRampToValueAtTime(i?0.10:0.15, t+i*0.26+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.26+0.22);
    o.connect(g); g.connect(master);
    o.start(t+i*0.26); o.stop(t+i*0.26+0.3);
  }
}
function beatLoop(){
  if(state==="end"||!AC) return;
  var iv = Math.max(430, 1650 - tension*1150);
  setTimeout(function(){
    if(state!=="end" && AC){ thump(); beatLoop(); }
  }, iv);
}
function creak(x){
  if(!AC) return;
  var t=AC.currentTime;
  var o=AC.createOscillator(), g=AC.createGain();
  o.type="sawtooth";
  var f0 = 80+Math.random()*70;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.linearRampToValueAtTime(f0*0.55, t+0.7);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.016, t+0.15);
  g.gain.linearRampToValueAtTime(0.0001, t+0.75);
  o.connect(g); out(g, x);
  o.start(t); o.stop(t+0.8);
}
function whisper(x){
  if(!AC || !window._noise) return;
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=window._noise;
  var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1700+Math.random()*700; f.Q.value=5;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.02, t+0.12);
  g.gain.linearRampToValueAtTime(0.003, t+0.3);
  g.gain.linearRampToValueAtTime(0.016, t+0.45);
  g.gain.linearRampToValueAtTime(0.0001, t+0.85);
  s.connect(f); f.connect(g); out(g, x);
  s.start(t); s.stop(t+0.9);
}
function boom(){
  if(!AC) return;
  var t=AC.currentTime;
  var o=AC.createOscillator(), g=AC.createGain();
  o.type="sine"; o.frequency.setValueAtTime(46,t);
  o.frequency.exponentialRampToValueAtTime(26, t+1.1);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22, t+0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, t+1.2);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+1.3);
}
function stinger(){
  if(!AC) return;
  var t=AC.currentTime;
  var fr=[178,182.5,187,89];
  for(var i=0;i<fr.length;i++){
    var o=AC.createOscillator(), g=AC.createGain();
    o.type="sawtooth"; o.frequency.value=fr[i];
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.09, t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+1.5);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+1.6);
  }
  if(window._noise){
    var s=AC.createBufferSource(); s.buffer=window._noise;
    var f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=900;
    var g2=AC.createGain();
    g2.gain.setValueAtTime(0.28,t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+0.9);
    s.connect(f); f.connect(g2); g2.connect(master);
    s.start(t); s.stop(t+1);
  }
  boom();
}

/* ============ 輸入 ============ */
var keys={};
window.addEventListener("keydown", function(e){
  if(state==="title"){ startGame(); return; }
  var k=e.key.toLowerCase();
  if(k==="e"||k===" "||k==="enter"){
    e.preventDefault();
    if(panelOpen) closePanel(); else doInteract();
    return;
  }
  if(k==="escape" && panelOpen){ closePanel(); return; }
  keys[k]=true;
});
window.addEventListener("keyup", function(e){ keys[e.key.toLowerCase()]=false; });
window.addEventListener("contextmenu", function(e){ e.preventDefault(); });

var touchStart=null, touchCur=null, touchDir={x:0,y:0};
cv.addEventListener("pointerdown", function(e){
  if(state==="title") return;
  if(state==="play"){ touchStart={x:e.clientX,y:e.clientY}; touchCur={x:e.clientX,y:e.clientY}; }
});
cv.addEventListener("pointermove", function(e){
  if(!touchStart) return;
  touchCur={x:e.clientX,y:e.clientY};
  var dx=touchCur.x-touchStart.x, dy=touchCur.y-touchStart.y;
  var len=Math.sqrt(dx*dx+dy*dy);
  if(len>1){ touchDir={x:dx/len, y:dy/len}; } else touchDir={x:0,y:0};
});
window.addEventListener("pointerup", function(){ touchStart=null; touchCur=null; touchDir={x:0,y:0}; });

/* ============ DOM ============ */
var elCount=document.getElementById("clueCount"),
    elHint=document.getElementById("hint"),
    elBtn=document.getElementById("actBtn"),
    elPanel=document.getElementById("panel"),
    elPT=document.getElementById("panelTitle"),
    elPX=document.getElementById("panelText"),
    elTitle=document.getElementById("title"),
    elEnd=document.getElementById("end");
var panelOpen=false;
elBtn.addEventListener("click", function(){ doInteract(); });
elPanel.addEventListener("click", function(){ closePanel(); });
document.getElementById("startBtn").addEventListener("click", function(){ startGame(); });
function startGame(){
  if(state!=="title") return;
  state="play";
  elTitle.hidden=true;
  initAudio();
}
function doInteract(){
  if(state!=="play") return;
  var it=nearestItem();
  if(!it || it.taken) return;
  it.taken=true;
  panelOpen=true;
  elPT.textContent=it.title;
  elPX.textContent=it.text;
  elPanel.hidden=false;
  elBtn.hidden=true;
  if(it.main){
    cluesMain++;
    elCount.textContent="線索 "+cluesMain+" / 3";
    if(cluesMain>=3 && !boomDone){
      boomDone=true;
      setTimeout(function(){ boom(); flickEvent(1.1); elHint.textContent="走廊的盡頭，燈在閃。"; }, 900);
    }
  }
  if(it.id==="desk"){
    noteTaken=true;
    elHint.textContent="姐姐的字條……她在查那個女生的名字。";
  }
}
function closePanel(){ panelOpen=false; elPanel.hidden=true; }
function flickEvent(dur){ flickUntil=time+dur; }

/* ============ 更新 ============ */
function collide(x,y){
  var r=player.r;
  var c0=Math.floor((x-r)/T), c1=Math.floor((x+r)/T);
  var r0=Math.floor((y-r)/T), r1=Math.floor((y+r)/T);
  for(var rr=r0;rr<=r1;rr++)for(var cc=c0;cc<=c1;cc++){
    if(!solid(tileAt(cc,rr))) continue;
    var nx=Math.max(cc*T, Math.min(x,(cc+1)*T));
    var ny=Math.max(rr*T, Math.min(y,(rr+1)*T));
    var dx=x-nx, dy=y-ny;
    if(dx*dx+dy*dy < r*r) return true;
  }
  return false;
}
function update(dt){
  time+=dt;
  if(state==="title"||state==="end") return;
  /* 移動 */
  if(state==="play"){
    var dx=0, dy=0;
    if(keys["w"]||keys["arrowup"]) dy-=1;
    if(keys["s"]||keys["arrowdown"]) dy+=1;
    if(keys["a"]||keys["arrowleft"]) dx-=1;
    if(keys["d"]||keys["arrowright"]) dx+=1;
    if(touchDir.x||touchDir.y){ dx=touchDir.x; dy=touchDir.y; }
    var len=Math.sqrt(dx*dx+dy*dy);
    if(len>0){
      dx/=len; dy/=len;
      var nx=player.x+dx*player.speed*dt;
      var ny=player.y+dy*player.speed*dt;
      if(!collide(nx,player.y)) player.x=nx;
      if(!collide(player.x,ny)) player.y=ny;
    }
  }
  /* 張力 */
  var dGate=Math.sqrt(Math.pow(32.5*T-player.x,2)+Math.pow(8.5*T-player.y,2));
  tension = 0.12 + cluesMain*0.22 + (state==="finale"?0.9:0) + Math.max(0,(650-dGate)/650)*0.25;
  tension = Math.min(tension, 1.4);
  /* 進入教室甲的第一次反應 */
  var pc=Math.floor(player.x/T), pr=Math.floor(player.y/T);
  if(!visitedA && pr<6 && pc<9){
    visitedA=true;
    flickEvent(0.8); whisper(player.x);
  }
  /* 收齊三條主線 → 回走廊觸發終幕 */
  if(state==="play" && cluesMain>=3 && pr>=7 && pr<=9){
    state="finale"; finaleT=0;
    appa={ x:32.5*T, y:8.5*T };
    stinger(); flickEvent(2.2);
  }
  if(state==="finale"){
    finaleT+=dt;
    var adx=player.x-appa.x, ady=player.y-appa.y;
    var ad=Math.sqrt(adx*adx+ady*ady)||1;
    appa.x += adx/ad*52*dt;
    appa.y += ady/ad*52*dt;
    if((ad<80 || finaleT>6.5) && !blackoutOn){ blackoutOn=true; }
  }
  if(blackoutOn){
    blackout=Math.min(1, blackout+dt*1.1);
    if(blackout>=1 && !ended){
      ended=true; state="end";
      elEnd.hidden=false;
      elBtn.hidden=true; closePanel();
    }
  }
  /* 燈光閃爍 */
  if(time<flickUntil){ flick=0.25+Math.random()*0.75; }
  else flick += (1-flick)*Math.min(1, dt*8);
  /* HUD */
  var near=nearestItem();
  if(state==="play" && near && !near.taken && !panelOpen){ elBtn.hidden=false; }
  else elBtn.hidden=true;
}

/* ============ 繪製 ============ */
function hash(c,r){ return ((c*73856093)^(r*19349663))>>>0; }
function draw(){
  ctx.fillStyle="#030304";
  ctx.fillRect(0,0,viewW,viewH);
  var camX=Math.max(0, Math.min(player.x-viewW/2, MW*T-viewW));
  var camY=Math.max(0, Math.min(player.y-viewH/2, MH*T-viewH));
  if(MW*T<viewW) camX=-(viewW-MW*T)/2;
  if(MH*T<viewH) camY=-(viewH-MH*T)/2;
  ctx.save();
  ctx.translate(-camX,-camY);
  var c0=Math.max(0,Math.floor(camX/T)-1), c1=Math.min(MW-1,Math.floor((camX+viewW)/T)+1);
  var r0=Math.max(0,Math.floor(camY/T)-1), r1=Math.min(MH-1,Math.floor((camY+viewH)/T)+1);
  for(var r=r0;r<=r1;r++)for(var c=c0;c<=c1;c++){
    var ch=tileAt(c,r), x=c*T, y=r*T;
    if(ch==="#"){
      ctx.fillStyle="#2e2f36"; ctx.fillRect(x,y,T,T);
      ctx.fillStyle="#26272d"; ctx.fillRect(x+3,y+3,T-6,T-6);
    } else if(ch==="L"){
      ctx.fillStyle="#191a1e"; ctx.fillRect(x,y,T,T);
      ctx.fillStyle="#23242b"; ctx.fillRect(x+8,y+4,T-16,T-8);
      ctx.strokeStyle="#5c5c66"; ctx.strokeRect(x+8.5,y+4.5,T-17,T-9);
      ctx.strokeStyle="#6e1d1d"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x+T/2, y+T/2, 9, 0.4, 5.2); ctx.stroke();
      ctx.lineWidth=1;
    } else if(ch==="W"){
      ctx.fillStyle="#2e2f36"; ctx.fillRect(x,y,T,T);
      ctx.fillStyle="#0a0f1c"; ctx.fillRect(x+6,y+8,T-12,T-16);
      ctx.fillStyle="#232f26";
      ctx.beginPath(); ctx.arc(x+T+34, y+T/2, 30, Math.PI*0.62, Math.PI*1.38); ctx.fill();
      ctx.strokeStyle="#3a3b44"; ctx.strokeRect(x+6.5,y+8.5,T-13,T-17);
    } else {
      var h=hash(c,r);
      var v=(h%7)*2;
      ctx.fillStyle="rgb("+(24+v)+","+(25+v)+","+(28+v)+")";
      ctx.fillRect(x,y,T,T);
      if(h%13===0){ ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(x+(h%30), y+(h%24), 14, 3); }
      if(ch==="D"){ ctx.strokeStyle="#141519"; ctx.beginPath(); ctx.moveTo(x,y+T/2); ctx.lineTo(x+T,y+T/2); ctx.stroke(); }
    }
  }
  /* 黑板 */
  drawBoard(3*T, 4, 4*T);
  /* 公告欄 */
  drawBoard2(8*T+4, 12*T-6);
  /* 教室乙翻倒課桌 */
  var desks=[[24,2],[25,4],[28,2],[29,4],[25,2.4],[28,3.2]];
  for(var i=0;i<desks.length;i++){
    ctx.save();
    ctx.translate(desks[i][0]*T, desks[i][1]*T);
    ctx.rotate(((i%2)?0.5:-0.7));
    ctx.fillStyle="#2b2925"; ctx.fillRect(-14,-9,28,18);
    ctx.fillStyle="#1d1c19"; ctx.fillRect(-14,6,28,3);
    ctx.restore();
  }
  /* 字條課桌（姐姐的） */
  ctx.fillStyle="#37342e"; ctx.fillRect(26*T+6, 3*T+8, 34, 22);
  ctx.fillStyle="#151411"; ctx.fillRect(26*T+6, 3*T+30, 34, 4);
  /* 協尋紙 */
  ctx.fillStyle="#a49c88"; ctx.fillRect(26*T+10, 7*T-18, 28, 20);
  ctx.fillStyle="#6b6558"; ctx.fillRect(26*T+14, 7*T-13, 20, 2);
  ctx.fillRect(26*T+14, 7*T-8, 14, 2);
  /* 線索微光 */
  for(var j=0;j<items.length;j++){
    var it=items[j];
    if(it.taken) continue;
    var d=Math.sqrt(Math.pow(it.x-player.x,2)+Math.pow(it.y-player.y,2));
    if(d<230){
      var a=0.22+0.18*Math.sin(time*4+j);
      ctx.fillStyle="rgba(215,210,190,"+a.toFixed(3)+")";
      ctx.beginPath(); ctx.arc(it.x-14, it.y-16, 2.2, 0, 7); ctx.fill();
    }
  }
  /* 玩家 */
  ctx.fillStyle="#0c0c0f";
  ctx.beginPath(); ctx.arc(player.x, player.y+3, 13, 0, 7); ctx.fill();
  ctx.fillStyle="#c9c2b4";
  ctx.beginPath(); ctx.arc(player.x, player.y, 11, 0, 7); ctx.fill();
  ctx.fillStyle="#8f887a";
  ctx.beginPath(); ctx.arc(player.x, player.y, 5, 0, 7); ctx.fill();
  /* 她 */
  if(state==="finale" && appa){
    drawApparition(appa.x, appa.y, 1);
  }
  ctx.restore();
  /* 黑暗與視野 */
  var px=player.x-camX, py=player.y-camY;
  var lr=178*(1+0.03*Math.sin(time*2.1))*flick;
  if(state==="finale") lr=128;
  var g=ctx.createRadialGradient(px,py,lr*0.3, px,py,lr);
  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(0.62,"rgba(0,0,0,0.82)");
  g.addColorStop(1,"rgba(2,2,3,0.995)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,viewW,viewH);
  if(state==="finale" && appa){
    drawApparition(appa.x-camX, appa.y-camY, 0.45);
  }
  /* 邊緣暗角 */
  var v2=ctx.createRadialGradient(viewW/2,viewH/2,Math.min(viewW,viewH)*0.35, viewW/2,viewH/2, Math.max(viewW,viewH)*0.72);
  v2.addColorStop(0,"rgba(0,0,0,0)");
  v2.addColorStop(1,"rgba(0,0,0,0.55)");
  ctx.fillStyle=v2; ctx.fillRect(0,0,viewW,viewH);
  /* 觸控搖桿 */
  if(touchStart&&touchCur){
    ctx.strokeStyle="rgba(200,195,180,.25)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(touchStart.x,touchStart.y,42,0,7); ctx.stroke();
    var ddx=touchCur.x-touchStart.x, ddy=touchCur.y-touchStart.y;
    var dl=Math.sqrt(ddx*ddx+ddy*ddy)||1;
    var cl=Math.min(dl,42);
    ctx.fillStyle="rgba(200,195,180,.3)";
    ctx.beginPath(); ctx.arc(touchStart.x+ddx/dl*cl, touchStart.y+ddy/dl*cl, 12, 0, 7); ctx.fill();
    ctx.lineWidth=1;
  }
  if(blackout>0){
    ctx.fillStyle="rgba(0,0,0,"+blackout.toFixed(3)+")";
    ctx.fillRect(0,0,viewW,viewH);
  }
}
function drawBoard(x, rows, w){
  ctx.fillStyle="#1e241f"; ctx.fillRect(x, 6, w, 34);
  ctx.strokeStyle="#3c4038"; ctx.strokeRect(x+0.5, 6.5, w-1, 33);
  ctx.strokeStyle="rgba(190,196,170,.5)";
  ctx.beginPath();
  ctx.moveTo(x+10, 14); ctx.lineTo(x+w-30, 14);
  ctx.moveTo(x+10, 22); ctx.lineTo(x+w-46, 22);
  ctx.moveTo(x+10, 30); ctx.lineTo(x+w-58, 30);
  ctx.stroke();
}
function drawBoard2(x, y){
  ctx.fillStyle="#372c23"; ctx.fillRect(x, y, 30, 40);
  ctx.fillStyle="#b3ab97"; ctx.fillRect(x+4, y+5, 22, 12);
  ctx.fillStyle="#8f887a"; ctx.fillRect(x+4, y+21, 22, 9);
  ctx.fillStyle="#372c23"; ctx.fillRect(x+18, y+23, 8, 7);
}
function drawApparition(x, y, alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  var sway=Math.sin(time*2.4)*2;
  ctx.fillStyle="#040405";
  ctx.beginPath();
  ctx.ellipse(x+sway, y-34, 9, 11, 0, 0, 7);
  ctx.fill();
  ctx.fillRect(x+sway-10, y-30, 20, 34);
  ctx.fillStyle="#08080b";
  ctx.fillRect(x+sway-14, y-30, 5, 40);
  ctx.fillRect(x+sway+9, y-30, 5, 40);
  ctx.fillStyle="#101014";
  ctx.beginPath(); ctx.ellipse(x+sway, y+6, 13, 18, 0, 0, 7); ctx.fill();
  ctx.restore();
}

/* ============ 主迴圈 ============ */
function loop(ts){
  var dt=Math.min(0.05,(ts-lastTs)/1000||0.016);
  lastTs=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
